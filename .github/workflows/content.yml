name: content
on:
  schedule:
    - cron: '10 21 * * *' # 00:10 Europe/Moscow (Moscow has no seasonal shift)
  workflow_dispatch:
concurrency: {group: content-publication, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run pipeline && npm run build && npm test
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data public
          git diff --cached --quiet || (git commit -m 'chore: publish daily question' && git push)
